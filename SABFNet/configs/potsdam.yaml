# ── SABFNet  ·  ISPRS Potsdam Training Config ─────────────────────────────────

dataset:
  name        : potsdam
  root        : /data/Potsdam             # ← change to your dataset path
  patch_size  : 256
  stride      : 128
  use_eroded  : true
  n_classes   : 6

dataloader:
  batch_size  : 1
  num_workers : 4
  pin_memory  : true

model:
  config_name    : SABFNet-R50
  pretrained     : true
  pretrained_path: pretrained/R50+ViT-B_16.npz

loss:
  lambda_ce  : 1.0
  lambda_dice: 1.0
  ignore_index: 255

optimizer:
  type        : AdamW
  lr          : 0.0001
  weight_decay: 0.01
  betas       : [0.9, 0.999]

scheduler:
  type       : cosine
  T_max      : 50
  eta_min    : 1.0e-6

training:
  epochs     : 50
  log_every  : 10
  val_every  : 1
  save_dir   : checkpoints/potsdam
  log_dir    : logs/potsdam

seed: 42
device: cuda
