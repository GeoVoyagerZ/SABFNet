# ── SABFNet  ·  ISPRS Vaihingen Training Config ──────────────────────────────

dataset:
  name        : vaihingen
  root        : /data/Vaihingen           # ← change to your dataset path
  patch_size  : 256
  stride      : 128                       # sliding-window stride (test/val)
  use_eroded  : true                      # boundary-eroded GT
  n_classes   : 6

dataloader:
  batch_size  : 1
  num_workers : 4
  pin_memory  : true

model:
  config_name    : SABFNet-R50
  pretrained     : true
  pretrained_path: pretrained/R50+ViT-B_16.npz

loss:
  lambda_ce  : 1.0
  lambda_dice: 1.0
  ignore_index: 255

optimizer:
  type        : AdamW
  lr          : 0.0001
  weight_decay: 0.01
  betas       : [0.9, 0.999]

scheduler:
  type       : cosine            # CosineAnnealingLR
  T_max      : 50
  eta_min    : 1.0e-6

training:
  epochs     : 50
  log_every  : 10               # log every N iterations
  val_every  : 1                # validate every N epochs
  save_dir   : checkpoints/vaihingen
  log_dir    : logs/vaihingen

seed: 42
device: cuda                    # 'cuda' or 'cpu'
